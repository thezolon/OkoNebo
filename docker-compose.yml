services:
  okonebo:
    image: okonebo:latest
    build: .
    container_name: okonebo
    ports:
      - "8888:8000"
    restart: "no"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - OKONEBO_DATA_DIR=/app/data
    volumes:
      - ./config.yaml:/app/config.yaml
      # A directory, not individual .db files. cache_db runs in WAL mode, which
      # creates <db>-wal and <db>-shm beside the database; with per-file mounts
      # those landed in the container layer and were discarded on every
      # recreate, which corrupted the cache database.
      - ./data:/app/data
    # Resource limits tuned for Raspberry Pi (Pi 4 / Pi 5 with 1–4 GB RAM).
    # Raise memory if running on a host with more available headroom.
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
